# ============================================================
#  NEVERA COURT — paste into server.secrets.cfg
# ============================================================
# Config.Locale = 'hr'  → Discord embed titles in Croatian
# (New case, Warrant, Form printed…)
# ============================================================

# ---------- TEXT LOGS (your channels) ----------
# #cases
set nevera_court_log_cases    "https://discord.com/api/webhooks/ID/TOKEN"

# #forms  (print / form filing — TEXT, not image)
set nevera_court_log_forms    "https://discord.com/api/webhooks/ID/TOKEN"

# #warrants
set nevera_court_log_warrants "https://discord.com/api/webhooks/ID/TOKEN"

# #bail
set nevera_court_log_bail     "https://discord.com/api/webhooks/ID/TOKEN"

# #fines
set nevera_court_log_fines    "https://discord.com/api/webhooks/ID/TOKEN"

# #verdicts
set nevera_court_log_verdicts "https://discord.com/api/webhooks/ID/TOKEN"

# #Admin-Actions
set nevera_court_log_admin    "https://discord.com/api/webhooks/ID/TOKEN"

# #Audit-Logs
set nevera_court_log_audit    "https://discord.com/api/webhooks/ID/TOKEN"

# #judicial-police  (transport requests + reinforced security)
set nevera_court_log_judicial "https://discord.com/api/webhooks/ID/TOKEN"


# ---------- A4 IMAGES (transcript backup) ----------
# One channel e.g. #court-transcripts → same webhook in ALL wh_* lines
set nevera_court_imgbb_key "YOUR_IMGBB_API_KEY"

set nevera_court_wh_criminal "https://discord.com/api/webhooks/ID/TOKEN"
